# Builds the APK on GitHub's servers and publishes it as a Release, so it can
# be downloaded straight onto a phone from the repository's Releases page.

name: Build APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ShortsBlocker.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ShortsBlocker.apk \
            --target "${{ github.sha }}" \
            --title "Shorts Blocker (latest build)" \
            --notes "Built from ${{ github.ref_name }} @ ${{ github.sha }}. On your phone, tap ShortsBlocker.apk below to download, then open it to install."
